name: release-quality

env:
  PYTHONDONTWRITEBYTECODE: "1"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate release package
        run: python scripts/validate_release.py
      - name: Run router and lifecycle tests
        working-directory: skills/route-gpt-5-6-work/scripts
        run: python -m unittest -v test_router test_routerctl
      - name: Run effective-config checker tests
        working-directory: scripts
        run: python -m unittest -v test_check_hooks test_standalonectl
      - name: Run deterministic routing fuzz
        run: python scripts/fuzz_router.py
      - name: Revalidate source integrity after tests
        run: python scripts/validate_release.py
