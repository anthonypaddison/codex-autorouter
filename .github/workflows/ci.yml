name: release-quality

env:
  PYTHONDONTWRITEBYTECODE: "1"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate release package
        run: python scripts/validate_release.py
      - name: Run router and lifecycle tests
        working-directory: skills/route-gpt-5-6-work/scripts
        run: python -m unittest -v test_spawn_compat test_router test_routerctl test_ai_routing
      - name: Run effective-config checker tests
        working-directory: scripts
        run: python -m unittest -v test_check_hooks test_standalonectl test_validate_release
      - name: Run capability benchmark harness tests
        run: python -m unittest -v benchmarks.test_autorouter_bench
      - name: Run active model-policy tests
        working-directory: skills/route-gpt-5-6-work/scripts
        run: python -m unittest -v test_model_policy
      - name: Run model catalogue tests
        working-directory: scripts
        run: python -m unittest -v test_model_catalogue
      - name: Run deterministic routing fuzz
        run: python scripts/fuzz_router.py
      - name: Revalidate source integrity after tests
        run: python scripts/validate_release.py
