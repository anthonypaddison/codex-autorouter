<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GPT-5.6 Router</title>
  <desc id="desc">Three orbital bodies representing Sol, Terra, and Luna around a routing core.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="sol" cx="36%" cy="32%">
      <stop offset="0" stop-color="#FFF7C2"/>
      <stop offset="0.4" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA580C"/>
    </radialGradient>
    <radialGradient id="terra" cx="36%" cy="30%">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </radialGradient>
    <radialGradient id="luna" cx="35%" cy="30%">
      <stop offset="0" stop-color="#F8FAFC"/>
