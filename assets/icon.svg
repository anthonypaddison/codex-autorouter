    <path d="M84 137 116 112l25 18 31-35" stroke="#E2E8F0" stroke-opacity=".9" stroke-width="7"/>
    <path d="m163 94 12-2-2 12" stroke="#E2E8F0" stroke-width="7"/>
  </g>
  <circle cx="56" cy="79" r="24" fill="url(#sol)" filter="url(#glow)"/>
  <circle cx="178" cy="157" r="22" fill="url(#terra)" filter="url(#glow)"/>
  <path d="M169 150c8-7 17-5 26 0-5 3-10 5-13 10-5-2-9-5-13-10Z" fill="#22C55E" opacity=".9"/>
